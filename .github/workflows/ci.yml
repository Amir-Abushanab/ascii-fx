# The gate every push and PR goes through, and the only path that publishes the docs.
#
# The docs deploy hangs off `check` rather than living in its own workflow, so a red
# suite cannot ship a broken showcase — two independent workflows would race, and the
# Pages one would win about half the time.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor every package declares in `engines`; without it that field is
        # a claim nothing tests. 24 is what development actually happens on.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The gpu-browser project drives real Chromium. Its WebGPU tests self-skip when
      # no adapter is available, which is the normal case on a GPU-less runner — the
      # rest of that project (canvas, CPU fallback, codecs) still runs.
      - run: pnpm exec playwright install --with-deps chromium
      # `check` builds first, deliberately. Cross-package imports resolve through each
      # package's `exports` to dist/*.d.ts, so on a clean checkout typecheck cannot see
      # @ascii-fx/core until it has been built — a failure that only ever appears on CI,
      # never on a machine with a warm dist/.
      - run: pnpm check
      # publint validates the published *manifest* (exports maps → real dist files,
      # files[] completeness); attw resolves the published *types* the way each
      # consumer's module resolution would; the smoke step installs the tarballs into a
      # throwaway npm project and actually imports and runs them. All three need a
      # finished build, and only the last one would notice a package that packs
      # perfectly and throws on import.
      - run: pnpm package:check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Thresholds live in vitest.config.ts and cover the node-tested packages only;
      # the browser suite holds the GPU and React packages to account separately.
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        # `always()` so the report still uploads when a threshold fails — lcov is written
        # before thresholds are evaluated, which is exactly when you want to read it.
        # Missing means vitest died before writing, so treat it as a failure rather than
        # letting the job pass having produced nothing.
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  # Deliberately not a `needs:` of anything. A new advisory lands without any change on
  # our side, so gating merges or the docs deploy on it would red-light unrelated PRs;
  # this job's job is to be visible. `high` and above only — `pnpm quality` runs the
  # same audit at `low` locally, where a noisy transitive advisory costs nothing.
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  deploy-docs:
    name: Deploy docs → GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages allows one deploy at a time; a queued run should wait, not be cancelled,
    # or main can end up published from an older commit.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm docs:build
        env:
          # Project pages live under /<repo>/ — user/organization pages
          # (<user>.github.io repos) should drop DOCS_BASE.
          DOCS_BASE: /${{ github.event.repository.name }}/
          DOCS_SITE: https://${{ github.repository_owner }}.github.io
          PUBLIC_REPOSITORY_URL: https://github.com/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist
      - id: deployment
        uses: actions/deploy-pages@v5
