# Deploys apps/docs (Astro) to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm quality
      - run: pnpm build
      - run: pnpm --filter @ascii-fx-internal/docs run build
        env:
          # Project pages live under /<repo>/ — user/organization pages
          # (<user>.github.io repos) should drop DOCS_BASE.
          DOCS_BASE: /${{ github.event.repository.name }}/
          DOCS_SITE: https://${{ github.repository_owner }}.github.io
          PUBLIC_REPOSITORY_URL: https://github.com/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
