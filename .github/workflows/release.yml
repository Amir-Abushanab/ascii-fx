name: Release

# Changesets-driven publishing. On every push to main:
#   • pending changesets → opens/updates a "Version Packages" PR (bumps versions + changelogs)
#   • that PR merged      → publishes the bumped @ascii-fx/* packages to npm, tags, GitHub Release
#
# Auth is OIDC / Trusted Publishing — no stored token. One-time prerequisites:
#   1. Publish 0.1.0 once from your laptop (`npm login` → `pnpm release`); npm cannot do a
#      package's FIRST publish over OIDC.
#   2. On each package's npm settings add a Trusted Publisher: this repo, workflow release.yml.
#      After that, CI publishes tokenlessly.
# The preflight job skips publishing until the packages exist on npm, so runs before step 1 stay green.
#
# changesets/action@v2, not @v1: v1 grepped the publish output for "New tag:" lines to learn
# what shipped, and the changesets v3 CLI doesn't always print them — liquid-glass-js 0.5.0
# hit npm on 2026-08-24 from a green run that pushed no tags and created no GitHub releases.
# v2 reads the CLI's CHANGESETS_OUTPUT file instead and pushes tags + releases via the
# GitHub API.

on:
  push:
    branches: [main]
    # Only when something publishable changes. A docs-only / benchmark / CI push has nothing
    # to publish, so skip the workflow rather than attempt a crash-prone no-op re-publish.
    paths:
      - 'packages/**'
      - '.changeset/**'
  workflow_dispatch: {}

# One release run at a time, and never cancel one in progress: a run cancelled mid-publish can
# leave packages on npm without their tags or GitHub releases. cancel-in-progress cannot tell a
# versioning run from a publishing one, so it is not the answer to a run that starts after main
# moved on; scripts/version-pr-guard.sh is (see the "Check main has not moved on" step).
# GitHub keeps only the newest PENDING run per group and cancels the older one. That newer run is
# at a newer commit, so it covers the versioning; but if it is in version mode (it carries new
# changesets) it publishes nothing, and a cancelled pending publish waits for the next publish run.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # version PR, tags, GitHub releases
  pull-requests: write # the Version Packages PR
  id-token: write # OIDC trusted publishing + provenance
  actions: write # ci-gate reads the CI run for this commit; CI is dispatched on the Version PR

jobs:
  # Publishing waits for CI on this exact commit. The two workflows trigger on the same push,
  # and without this the release (about a minute) finished before CI's check jobs (2-11) and
  # shipped a commit CI had not yet passed. The publish stays in this file rather than becoming
  # a job in ci.yml for two reasons: npm's trusted publisher for every package is bound to the
  # workflow file release.yml, and ci.yml cancels in-progress runs on a newer push, which must
  # never land in the middle of a publish.
  #
  # Gates on the jobs that test what ships: both check & build jobs and coverage. The audit job
  # is deliberately not a gate (see ci.yml), and the docs deploy is not a test.
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The CI run for this commit: the push run, or for a manual dispatch whatever
          # pushed this commit to main. Polled, because it may not be registered yet.
          while :; do
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
              --event push --limit 1 --json databaseId,status,conclusion \
              --jq '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion)"')
            if [ -n "$run" ]; then
              read -r id status conclusion <<<"$run"
              [ "$status" = "completed" ] && break
              echo "CI run $id is $status"
            else
              echo "no CI run for $SHA yet"
            fi
            sleep 20
          done

          if [ "$conclusion" = "cancelled" ]; then
            echo "::error::CI run $id for $SHA was cancelled (a newer push to main supersedes it). Nothing was published. If that push does not touch packages/ or .changeset/, release.yml will not run for it, so re-run CI on this commit and then this workflow (or dispatch it on main)."
            exit 1
          fi

          # Required jobs only: the run's own conclusion also counts the audit, which gates nothing.
          failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
            --jq '.jobs[] | select((.name | startswith("Check & build")) or .name == "Coverage")
                  | select(.conclusion != "success") | "\(.name): \(.conclusion)"')
          required=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
            --jq '[.jobs[] | select((.name | startswith("Check & build")) or .name == "Coverage")] | length')
          if [ -n "$failed" ] || [ "$required" -lt 3 ]; then
            echo "::error::CI run $id did not pass the jobs a release needs:"
            echo "${failed:-  (found $required of 3 required jobs)}"
            exit 1
          fi
          echo "CI run $id passed check & build (Node 22, 24) and coverage for $SHA"

  preflight:
    name: Publish gate
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - id: gate
        run: |
          if npm view @ascii-fx/core version >/dev/null 2>&1; then
            echo "publish=pnpm release" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::@ascii-fx/* not on npm yet — managing Version PRs only. Publish 0.1.0 from your laptop, then enable Trusted Publishing."
          fi

  release:
    name: Version or publish
    needs: [ci-gate, preflight]
    runs-on: ubuntu-latest
    steps:
      # Taken before anything else, so that "newer than this" in the guard step means "made by
      # this run": the previous run's branch push and PR update are older.
      - id: started
        run: echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm >= 11.5.1; Node 24 may ship an older npm.
      - run: npm install -g npm@latest
      # Versioning reads the commit this run checked out, but a run can start long after its push
      # (it waits for the run ahead of it in the concurrency group, then for CI), and main may
      # have moved on by then. orb3d #16: the run for 71db24e versioned it after #15 had put 0.3.1 on main,
      # and opened a Version PR bumping nothing. If main has since changed under packages/ or
      # .changeset/, the release run for that push is queued behind this one and versions from it,
      # so this one skips the action. Never skips a publish (a checkout with no changesets).
      - name: Check main has not moved on
        id: fresh
        run: bash scripts/version-pr-guard.sh precheck
      - name: Version Packages PR / publish
        id: changesets
        if: steps.fresh.outputs.skip != 'true'
        # Soft-fail on purpose. This action manages BOTH the version PR and the publish, and
        # reports PR-API problems as a bare `HttpError` — an Octokit RequestError with an empty
        # message, so `Error.toString()` degrades to just the name. That tells you nothing and
        # kills the run. The guard step below decides the real outcome and prints the actual error.
        continue-on-error: true
        uses: changesets/action@v2
        with:
          # `pnpm run version` = changeset version + sync the skill's library_version, so the
          # skill bump rides this same PR instead of drifting behind the packages.
          version-script: pnpm run version
          # Empty until the packages exist on npm (see preflight) → PR-only, no publish attempt.
          publish-script: ${{ needs.preflight.outputs.publish }}
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        # No GITHUB_TOKEN env: v2 only reads its github-token input, which already
        # defaults to this workflow's token.
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          # Fallback if OIDC publishing misbehaves (pnpm's OIDC support is still maturing):
          # add a granular NPM_TOKEN secret and uncomment the next line.
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Decide the run's real outcome, and self-heal the failure the action cannot report on:
      # both observed flakes leave the version branch pushed but no PR open — an empty-body
      # HttpError on the create path, and "State cannot be changed" on the update path when the
      # PR it listed as open gets merged mid-run. `gh` prints the real status, so a genuine
      # block — e.g. the account-level "Allow GitHub Actions to create and approve pull
      # requests" toggle — surfaces as a message rather than as "HttpError".
      #
      # scripts/version-pr-guard.sh ensure compares the version branch against main fetched fresh at
      # this point, not this run's checkout, and acts only on a `version` newer than main's
      # (dependency edits on a leftover branch are not a release, orb3d #12). An open Version PR
      # that bumps nothing main lacks is closed with a comment and its branch deleted: it was
      # versioned from a commit main has since released past, or main moved during the action.
      - name: Ensure Version Packages PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.changesets.outcome }}
          STARTED: ${{ steps.started.outputs.at }}
        run: bash scripts/version-pr-guard.sh ensure
      # CI for the Version PR. The action pushes that branch with this workflow's token, and
      # GitHub runs nothing for a token-made event: the PR's pull_request run fails at once with
      # zero jobs, and only went green after a manual approve or re-run. workflow_dispatch is
      # the one trigger that token may fire, and its checks land on the branch head, so they
      # show on the PR.
      - name: Run CI on the Version PR
        # Not when versioning was skipped: the newer run dispatches it for the PR it updates.
        if: always() && steps.fresh.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch=changeset-release/main
          # Key on an open PR, not on the branch being ahead: a branch left over from a
          # squash-merged version PR stays ahead without being a Version PR worth testing.
          if [ "$(gh pr list --head "$branch" --base main --state open --json number --jq 'length')" = "0" ]; then
            echo "::notice::no Version PR to test"
            exit 0
          fi
          gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$branch"
          echo "Dispatched CI on $branch"
