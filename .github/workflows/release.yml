name: Release

# Changesets-driven publishing: when a "Version Packages" PR is merged, publishes the bumped
# @ascii-fx/* packages to npm, tags them and cuts GitHub Releases. Opening and updating that PR is
# version.yml's job; this workflow never versions.
#
# Auth is OIDC / Trusted Publishing — no stored token. One-time prerequisites:
#   1. Publish 0.1.0 once from your laptop (`npm login` → `pnpm release`); npm cannot do a
#      package's FIRST publish over OIDC.
#   2. On each package's npm settings add a Trusted Publisher: this repo, workflow release.yml.
#      After that, CI publishes tokenlessly.
# The preflight job skips publishing until the packages exist on npm, so runs before step 1 stay green.
#
# changesets/action@v2, not @v1: v1 grepped the publish output for "New tag:" lines to learn
# what shipped, and the changesets v3 CLI doesn't always print them — liquid-glass-js 0.5.0
# hit npm on 2026-08-24 from a green run that pushed no tags and created no GitHub releases.
# v2 reads the CLI's CHANGESETS_OUTPUT file instead and pushes tags + releases via the
# GitHub API.

on:
  push:
    branches: [main]
    # Only the pushes that merge a Version PR. `changeset version` is the only thing that writes a
    # package CHANGELOG, so this is the one path filter that picks out those pushes, and it keeps
    # every other push out of this workflow's concurrency group (see below).
    paths:
      - 'packages/**/CHANGELOG.md'
  # Manual catch-up. It publishes whatever version npm lacks from the dispatched ref's CURRENT
  # tree, which may already hold changes meant for the next version; to redo a cancelled or
  # failed publish, re-run that run instead (a re-run keeps its original commit).
  workflow_dispatch: {}

# One publish at a time, and never cancel one in progress: a run cancelled mid-publish can leave
# packages on npm without their tags or GitHub releases. GitHub keeps only the NEWEST pending run
# per group and cancels the one before it, which is why versioning lives in version.yml: when
# both shared a group, a feature push could cancel a pending publish and then, carrying new
# changesets, publish nothing itself. Only Version PR merges queue here now, so a pending publish
# can only be replaced by a later Version PR merge's, which publishes main's newer versions (an
# intermediate version is skipped only if three Version PRs merge within one publish run).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # tags, GitHub releases
  id-token: write # OIDC trusted publishing + provenance
  actions: read # ci-gate reads the CI run for this commit

jobs:
  # Publishing waits for CI on this exact commit. The two workflows trigger on the same push,
  # and without this the release (about a minute) finished before CI's check jobs (2-11) and
  # shipped a commit CI had not yet passed. The publish stays in this file rather than becoming
  # a job in ci.yml for two reasons: npm's trusted publisher for every package is bound to the
  # workflow file release.yml, and ci.yml cancels in-progress runs on a newer push, which must
  # never land in the middle of a publish.
  #
  # Gates on the jobs that test what ships: both check & build jobs and coverage. The audit job
  # is deliberately not a gate (see ci.yml), and the docs deploy is not a test.
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The CI run for this commit: the push run, or for a manual dispatch whatever
          # pushed this commit to main. Polled, because it may not be registered yet.
          while :; do
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
              --event push --limit 1 --json databaseId,status,conclusion \
              --jq '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion)"')
            if [ -n "$run" ]; then
              read -r id status conclusion <<<"$run"
              [ "$status" = "completed" ] && break
              echo "CI run $id is $status"
            else
              echo "no CI run for $SHA yet"
            fi
            sleep 20
          done

          if [ "$conclusion" = "cancelled" ]; then
            echo "::error::CI run $id for $SHA was cancelled (a newer push to main supersedes it). Nothing was published. Re-run CI on this commit, then re-run this workflow run (a re-run keeps this commit)."
            exit 1
          fi

          # Required jobs only: the run's own conclusion also counts the audit, which gates nothing.
          failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
            --jq '.jobs[] | select((.name | startswith("Check & build")) or .name == "Coverage")
                  | select(.conclusion != "success") | "\(.name): \(.conclusion)"')
          required=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
            --jq '[.jobs[] | select((.name | startswith("Check & build")) or .name == "Coverage")] | length')
          if [ -n "$failed" ] || [ "$required" -lt 3 ]; then
            echo "::error::CI run $id did not pass the jobs a release needs:"
            echo "${failed:-  (found $required of 3 required jobs)}"
            exit 1
          fi
          echo "CI run $id passed check & build (Node 22, 24) and coverage for $SHA"

  preflight:
    name: Publish gate
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - id: gate
        run: |
          if npm view @ascii-fx/core version >/dev/null 2>&1; then
            echo "publish=pnpm release" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::@ascii-fx/* not on npm yet — nothing to publish here. Publish 0.1.0 from your laptop, then enable Trusted Publishing."
          fi

  release:
    name: Publish
    needs: [ci-gate, preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm >= 11.5.1; Node 24 may ship an older npm.
      - run: npm install -g npm@latest
      # A Version PR merge can still carry changesets: one merged after the PR was last versioned,
      # whose version run had not updated it yet. changesets/action would then go to version mode
      # and publish nothing, leaving the merged versions unpublished. The files only drive
      # versioning (version.yml versions them into the next PR) and are not in any package, so
      # drop them from this checkout and publish the tree the Version PR merged.
      - name: Set aside changesets for the next Version PR
        run: |
          set -euo pipefail
          for f in .changeset/*.md; do
            [ -e "$f" ] && [ "$(basename "$f")" != README.md ] || continue
            echo "::notice::$f arrived with this merge; version.yml versions it into the next Version PR"
            rm "$f"
          done
      - name: Publish
        id: changesets
        uses: changesets/action@v2
        with:
          # Empty until the packages exist on npm (see preflight): then this does nothing.
          publish-script: ${{ needs.preflight.outputs.publish }}
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          # Fallback if OIDC publishing misbehaves (pnpm's OIDC support is still maturing):
          # add a granular NPM_TOKEN secret and uncomment the next line.
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
