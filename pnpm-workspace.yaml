packages:
  - packages/*
  - apps/*

# Never install a version published less than 7 days ago (10080 minutes). Compromised
# releases are typically yanked within hours-to-days, so a week's lag lets the ecosystem
# find the bad ones first, at the cost of adopting genuine fixes a week late. This is the
# install-time gate and it covers transitive dependencies too; the matching `cooldown` in
# `.ncurc.json` only governs what npm-check-updates proposes for direct deps.
#
# `pnpm install --frozen-lockfile` re-applies this to every lockfile entry, so a lockfile
# has to be resolved under the policy to stay installable. It stays green over time —
# versions only get older — but a lockfile rebuilt without the policy will fail CI until
# it is re-resolved with it.
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true
  sharp: true

overrides:
  # Advisory floors for astro's transitive tree. astro pulls these itself and had not
  # released a bump past them, so the floor is here rather than waiting on it:
  #   sharp   >=0.35.4  GHSA-g89c-p67h-r497  (libheif)
  #   js-yaml >=4.3.2   GHSA-2883-xcg3-v3hh  (maxTotalMergeKeys CPU use)
  #   svgo    >=4.1.0   GHSA-w27v-7q3p-w38r  (removeScripts bypasses)
  # Drop each one once astro's own range clears it.
  sharp: ^0.35.4
  js-yaml: ^4.3.2
  svgo: ^4.1.0
  esbuild: ^0.28.2
  aalib.js>vue: '-'
